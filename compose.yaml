services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: zhiguang
      MYSQL_USER: zhiguang
      MYSQL_PASSWORD: zhiguang_dev
      MYSQL_ROOT_PASSWORD: root_dev
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
    volumes:
      - ./.docker-data/mysql:/var/lib/mysql
      - ./backend/db/canal-user.sql:/docker-entrypoint-initdb.d/00-canal-user.sql:ro
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./.docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - ./.docker-data/elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  canal:
    image: canal/canal-server:v1.1.8
    environment:
      canal.auto.scan: "false"
      canal.destinations: example
      canal.instance.master.address: mysql:3306
      canal.instance.dbUsername: canal
      canal.instance.dbPassword: Canal@123456
      canal.instance.connectionCharset: UTF-8
      canal.instance.tsdb.enable: "true"
      canal.instance.gtidon: "false"
      canal.instance.filter.regex: zhiguang\\.outbox
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/11111'"]
      interval: 10s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
    env_file:
      - path: ./.env
        required: false
      - path: ../Concord/backend/.env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/zhiguang?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: zhiguang
      SPRING_DATASOURCE_PASSWORD: zhiguang_dev
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: earliest
      SPRING_KAFKA_CONSUMER_ENABLE_AUTO_COMMIT: "false"
      SPRING_KAFKA_LISTENER_ACK_MODE: manual_immediate
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_AI_VECTORSTORE_ELASTICSEARCH_INDEX_NAME: zhiguang-ai-index
      SPRING_AI_VECTORSTORE_ELASTICSEARCH_INITIALIZE_SCHEMA: "true"
      AUTH_JWT_PRIVATE_KEY: classpath:keys/private.pem
      AUTH_JWT_PUBLIC_KEY: classpath:keys/public.pem
      MYBATIS_MAPPER_LOCATIONS: classpath*:mapper/*.xml
      CANAL_ENABLED: "true"
      CANAL_HOST: canal
      CANAL_PORT: 11111
      CANAL_DESTINATION: example
      CANAL_USERNAME: ""
      CANAL_PASSWORD: ""
      CANAL_FILTER: zhiguang.outbox
      CANAL_BATCHSIZE: 100
      CANAL_INTERVALMS: 1000
      OSS_ENDPOINT: ${OSS_ENDPOINT:-http://localhost}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-disabled}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-disabled}
      OSS_BUCKET: ${OSS_BUCKET:-zhiguang-dev}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      canal:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend/zhiguang_fe-main
    depends_on:
      - backend
    ports:
      - "5173:80"

